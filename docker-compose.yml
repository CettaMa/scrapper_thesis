services:
  cctv-scraper:
    build: .
    image: cctv-scraper:latest
    container_name: cctv-scraper
    restart: unless-stopped
    healthcheck:
      # A healthy process must keep producing dataset/log/status files. Killing PID 1
      # makes the existing restart policy recover a hung-but-alive container.
      test:
        - CMD-SHELL
        - >-
          find /app/dataset -type f -mmin -5 -print -quit | grep -q . ||
          (echo 'no recent dataset writes' >&2; kill -TERM 1; exit 1)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    devices:
      - /dev/dri:/dev/dri
    extra_hosts:
      - "atcs-dishubkbb.urbanaccess.net:103.151.226.229"
    env_file:
      - .env
    environment:
      CCTV_CONFIG_FILE: /app/cctv_points.csv
      CCTV_OUTPUT_ROOT: /app/dataset
      TZ: Asia/Jakarta
      LIBVA_DRIVER_NAME: iHD
      LIBVA_DRIVERS_PATH: /usr/lib/x86_64-linux-gnu/dri
    # These must match the host device group IDs; do not use hard-coded defaults.
    group_add:
      - "${RENDER_GID:?Set RENDER_GID to the host render group GID}"
      - "${VIDEO_GID:?Set VIDEO_GID to the host video group GID}"
    volumes:
      - ./dataset:/app/dataset
      - ./cctv_points.csv:/app/cctv_points.csv:ro